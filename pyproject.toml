[project]
name = "examkb"
version = "0.1.0"
description = "Study platform over the exam-kb corpus: browse, sit mock exams, track progress."
readme = "README.md"
requires-python = ">=3.12"

# Pinned on purpose. uv.lock is committed alongside, so a checkout resolves to the
# exact tree this was built against. Phases 0-4 are the LLM-free slice: no LLM SDK
# belongs here until issue 029.
dependencies = [
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "uvicorn==0.54.0",
    "python-multipart==0.0.20",
]

[dependency-groups]
# httpx is Starlette's TestClient transport -- test-only, never imported by the app.
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "playwright==1.56.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the fast one: anything that drives a parser over the real
# `data/` is marked `slow` and deselected here. A command-line -m overrides this,
# so `pytest -m slow` runs exactly those and `pytest -m ""` runs everything.
addopts = ["-m", "not slow", "--strict-markers"]
markers = [
    "slow: seconds, not milliseconds -- the real pipeline over data/, or a full corpus sweep",
]
filterwarnings = [
    "error",
    # Starlette 1.7 wants `httpx2` for its TestClient. `httpx` still works and is
    # the package this project already depends on; moving is a deliberate upgrade,
    # not something to do while the warning is merely noisy. Test-only either way.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[project.scripts]
examkb = "examkb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examkb"]
